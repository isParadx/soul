# server配置
server:
  port: 8080
  servlet:
    context-path: /
  # 文件上传配置
  multipart:
    enabled: true
    max-file-size: 10MB
    max-request-size: 10MB

# 连接池配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/soul?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: '123456'
      driver-class-name: com.mysql.cj.jdbc.Driver

# mybatis-plus的配置
mybatis-plus:
  type-aliases-package: com.paradx.soul.pojo
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

#jwt配置
jwt:
  token:
    tokenExpiration: 120 #有效时间,单位分钟
    # 安全加固：使用更强的签名密钥（生产环境应从环境变量读取）
    tokenSignKey: Soul@2024#Secure$Jwt%Key^256bit!Random&String

# 文件存储路径
file:
  upload:
    path: uploads/avatars/
